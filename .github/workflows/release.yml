# Builds the release files and publishes a GitHub Release when a version tag
# (v0.2.25, ...) is pushed: the same files build.bat and build_linux.sh make.
#
#   git tag v0.2.25 && git push origin v0.2.25
#
# Can also be run by hand (Actions > release > Run workflow): with only a tag
# it rebuilds that tag; with a ref too it builds that commit or branch and the
# release creates the tag there (for when tags can't be pushed).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.25)'
        required: true
      ref:
        description: 'Commit or branch to build if the tag does not exist yet (e.g. release)'
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # What to build: the pushed tag, or the given ref, or the existing tag.
  SRC: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}
  WAILS_VERSION: v2.11.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build (wails build) — choboterm.exe
        run: wails build -clean
      - name: Test
        run: go test ./...
      - name: Build choboterm-headless.exe (console, no window)
        run: go build -tags headless -trimpath -ldflags "-s -w" -o build/bin/choboterm-headless.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/bin/choboterm.exe
            build/bin/choboterm-headless.exe
          if-no-files-found: error

  linux:
    # Ubuntu 22.04, like tools/linux/Dockerfile: runs on glibc 2.35 and later.
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Commit being built
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build (build_linux.sh --native) — tar.gz and headless
        run: ./build_linux.sh --native
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/choboterm-linux-amd64.tar.gz
            release/choboterm-headless-linux-amd64
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.linux.outputs.sha }}
        run: |
          version="${TAG#v}"
          # --target: where a tag that doesn't exist yet is created.
          gh release create "$TAG" --target "$SHA" \
            "dist/windows/choboterm.exe#choboterm.exe (Windows x64)" \
            "dist/linux/choboterm-linux-amd64.tar.gz#choboterm-linux-amd64.tar.gz (Linux x86_64)" \
            "dist/windows/choboterm-headless.exe#choboterm-headless.exe (web server, Windows x64)" \
            "dist/linux/choboterm-headless-linux-amd64#choboterm-headless-linux-amd64 (web server, Linux x86_64 static)" \
            --title "choboterm V$version" --generate-notes
          # Keep only V0.2.24 on the Releases page, as requested. Keep git tags
          # so older source revisions remain addressable.
          if [[ "$TAG" == "v0.2.24" ]]; then
            while IFS= read -r old; do
              [[ -z "$old" || "$old" == "$TAG" ]] || gh release delete "$old" --yes
            done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          fi
