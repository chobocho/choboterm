<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>choboterm</title>
</head>
<body>
<div id="tabbar">
    <div id="tabs"></div>
    <button type="button" id="newTab" title="새 탭 (Ctrl+Shift+T)">+</button>
</div>
<div id="terms"></div>
<div id="toast" hidden></div>

<div id="search" hidden>
    <input id="searchInput" placeholder="검색" spellcheck="false" autocomplete="off"/>
    <span id="searchCount"></span>
    <button type="button" id="searchCase" title="대소문자 구분 (Alt+C)">Aa</button>
    <button type="button" id="searchRegex" title="정규식 (Alt+R)">.*</button>
    <button type="button" id="searchPrev" title="위로 (Enter)">↑</button>
    <button type="button" id="searchNext" title="아래로 (Shift+Enter)">↓</button>
    <button type="button" id="searchClose" title="닫기 (Esc)">✕</button>
</div>

<ul id="tabMenu" class="menu" hidden>
    <li data-act="reconnect">다시 연결</li>
    <li data-act="duplicate">복제 (새 탭으로 같은 서버 접속)</li>
    <li data-act="files">파일 전송</li>
    <li data-act="disconnect">연결 끊기</li>
    <li class="sep"></li>
    <li data-act="close">탭 닫기</li>
</ul>

<div id="overlay" class="overlay" hidden>
    <form id="connect" class="dialog" autocomplete="off">
        <div class="titlebar">
            <img class="icon" src="./src/assets/icon.png" alt=""/>
            <span class="title">choboterm - Connect to</span>
            <button type="button" class="close" id="close" title="닫기">✕</button>
        </div>
        <div class="body">
            <label for="host">Host</label>
            <div class="combo">
                <input id="host" spellcheck="false"/>
                <button type="button" id="hostDrop" tabindex="-1">▼</button>
                <ul id="hostList" hidden></ul>
            </div>

            <label for="port">Port</label>
            <div class="port">
                <input id="port" inputmode="numeric" value="23"/>
                <span id="proto">Telnet</span>
            </div>

            <label for="login">Login</label>
            <input id="login" spellcheck="false"/>

            <label for="pass">Pass</label>
            <input id="pass" type="password"/>

            <label for="encoding">Code</label>
            <select id="encoding">
                <option value="UTF-8">UTF-8</option>
                <option value="EUC-KR">EUC-KR (CP949)</option>
            </select>

            <div class="error" id="error"></div>

            <div class="buttons">
                <button type="submit" id="ok"><u>C</u>onnect</button>
                <button type="button" id="cancel">C<u>a</u>ncel</button>
            </div>
        </div>
    </form>
</div>

<div id="filesOverlay" class="overlay" hidden>
    <div class="dialog files" id="files" tabindex="-1">
        <div class="titlebar">
            <img class="icon" src="./src/assets/icon.png" alt=""/>
            <span class="title" id="filesTitle">파일 전송</span>
            <button type="button" class="close" id="filesX" title="닫기">✕</button>
        </div>
        <div class="body">
            <div class="toolbar">
                <button type="button" id="fUp" title="상위 폴더 (Backspace)">↑</button>
                <input id="fPath" spellcheck="false"/>
                <button type="button" id="fRefresh" title="새로 고침 (F5)">⟳</button>
            </div>
            <div class="flist">
                <table>
                    <thead><tr><th>이름</th><th class="num">크기</th><th>수정한 날짜</th></tr></thead>
                    <tbody id="fBody"></tbody>
                </table>
            </div>
            <div class="error" id="fError"></div>
            <div id="xferSlot"></div>
            <div class="buttons">
                <button type="button" id="fUpload">업로드...</button>
                <button type="button" id="fDownload">다운로드</button>
                <button type="button" id="fClose">닫기</button>
            </div>
        </div>
    </div>
</div>

<div id="pasteOverlay" class="overlay modal" hidden>
    <div class="dialog paste" id="paste" tabindex="-1">
        <div class="titlebar">
            <img class="icon" src="./src/assets/icon.png" alt=""/>
            <span class="title">여러 줄 붙여넣기</span>
            <button type="button" class="close" id="pasteX" title="닫기 (Esc)">✕</button>
        </div>
        <div class="body">
            <div id="pasteInfo"></div>
            <pre id="pastePreview"></pre>
            <label class="check"><input type="checkbox" id="pasteNoAsk"/> 다시 묻지 않기</label>
            <div class="buttons">
                <button type="button" id="pasteOk">붙여넣기</button>
                <button type="button" id="pasteCancel">취소</button>
            </div>
        </div>
    </div>
</div>

<div id="helpOverlay" class="overlay modal help" hidden>
    <div class="dialog help" id="help" tabindex="-1">
        <div class="titlebar">
            <img class="icon" src="./src/assets/icon.png" alt=""/>
            <span class="title" id="helpTitle"></span>
            <button type="button" class="close" id="helpX" title="Esc">✕</button>
        </div>
        <div class="body">
            <div id="helpContent"></div>
            <div class="buttons">
                <button type="button" id="helpLang" title="Alt+L"></button>
                <button type="button" id="helpClose"></button>
            </div>
        </div>
    </div>
</div>

<div id="xfer" hidden>
    <div id="xferName"></div>
    <div class="bar"><div id="xferBar"></div></div>
    <div class="row">
        <span id="xferText"></span>
        <button type="button" id="xferCancel">취소</button>
    </div>
</div>

<script src="./src/main.ts" type="module"></script>
</body>
</html>
