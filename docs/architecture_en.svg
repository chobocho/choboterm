<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="868" viewBox="0 0 1010 868" font-family="'Segoe UI', 'Malgun Gothic', 'Noto Sans', sans-serif" font-size="11" fill="#202124">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowWeb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/>
    </marker>
    <style>
      .title { font-size: 12px; font-weight: bold; }
      .head { font-size: 13px; font-weight: bold; }
      .sub { fill: #5f6368; }
      .note { font-size: 10.5px; fill: #3c4043; }
      .item { fill: #ffffff; stroke-width: 1; }
      .link { stroke: #5f6368; stroke-width: 1.5; fill: none; }
      .web { stroke: #c5221f; stroke-width: 1.5; fill: none; }
      .new { fill: #c5221f; font-size: 9.5px; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="1010" height="868" rx="10" fill="#ffffff"/>
  <text x="20" y="36" font-size="18" font-weight="bold">choboterm Architecture</text>
  <text x="990" y="36" text-anchor="end" class="note">V0.2.30 · <tspan class="new">NEW</tspan> = changed lately (the cat: walks about, click it to run Lua without a tab, a log of the runs)</text>

  <!-- Frontend -->
  <rect x="20" y="60" width="270" height="621" rx="8" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="35" y="82" class="head" fill="#1a4fa3">Frontend (WebView2 · WebKitGTK)</text>
  <g class="item" stroke="#4a7bd0">
    <rect x="35" y="95" width="240" height="48" rx="5"/>
    <rect x="35" y="153" width="240" height="48" rx="5"/>
    <rect x="35" y="211" width="240" height="48" rx="5"/>
    <rect x="35" y="269" width="240" height="48" rx="5"/>
    <rect x="35" y="327" width="240" height="48" rx="5"/>
    <rect x="35" y="385" width="240" height="48" rx="5"/>
    <rect x="35" y="443" width="240" height="48" rx="5"/>
    <rect x="35" y="501" width="240" height="48" rx="5"/>
    <rect x="35" y="559" width="240" height="48" rx="5"/>
    <rect x="35" y="617" width="240" height="48" rx="5"/>
  </g>
  <text x="47" y="115" class="title">main · tabs · connection</text>
  <text x="47" y="132" class="sub">Tabs · terminal · main.ts split into modules</text>
  <text x="47" y="173" class="title">highlight.ts</text>
  <text x="47" y="190" class="sub">Keyword highlight (xterm decorations)</text>
  <text x="47" y="231" class="title">files.ts</text>
  <text x="47" y="248" class="sub">File transfer window (SFTP · SCP · FTP)</text>
  <text x="47" y="289" class="title">viewer.ts · imageview.ts</text>
  <text x="47" y="306" class="sub">Text viewer/editor (CodeMirror), images</text>
  <text x="47" y="347" class="title">luaconsole.ts · memo.ts</text>
  <text x="47" y="364" class="sub">Lua REPL · memo autosave · Ctrl+Shift+B</text>
  <text x="47" y="405" class="title">containers.ts</text>
  <text x="47" y="422" class="sub">Docker window (shell · logs · open port)</text>
  <text x="47" y="463" class="title">prefs.ts</text>
  <text x="47" y="480" class="sub">Settings · web server · access token</text>
  <text x="47" y="521" class="title">i18n.ts</text>
  <text x="47" y="538" class="sub">English UI: translates text via dictionary</text>
  <text x="47" y="579" class="title">sessions · help · search · platform</text>
  <text x="47" y="596" class="sub">Sessions, help, search, platform</text>
  <text x="47" y="637" class="title">cat.ts <tspan class="new">NEW</tspan></text>
  <text x="47" y="654" class="sub">The cat: walks · drag · click for Lua · log</text>

  <!-- Wails bridge -->
  <line x1="292" y1="160" x2="398" y2="160" class="link" marker-end="url(#arrow)"/>
  <text x="345" y="96" text-anchor="middle" class="note" font-weight="bold">Go method calls</text>
  <text x="345" y="112" text-anchor="middle" class="note">Connect · Send</text>
  <text x="345" y="128" text-anchor="middle" class="note">Resize · ConsoleEval</text>
  <text x="345" y="144" text-anchor="middle" class="note">EvalLua etc.</text>
  <line x1="398" y1="300" x2="292" y2="300" class="link" marker-end="url(#arrow)"/>
  <text x="345" y="320" text-anchor="middle" class="note" font-weight="bold">Events</text>
  <text x="345" y="336" text-anchor="middle" class="note">term:data</text>
  <text x="345" y="352" text-anchor="middle" class="note">(base64 batches)</text>
  <text x="345" y="368" text-anchor="middle" class="note">script:* · progress</text>
  <text x="345" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">Wails v2</text>
  <text x="345" y="246" text-anchor="middle" class="note">bindings</text>

  <!-- Browser (web server clients) -->
  <rect x="20" y="703" width="270" height="140" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="35" y="725" class="head" fill="#a50e0e">Browser (this PC · other PCs)</text>
  <text x="35" y="745" class="sub">Same page (frontend/dist) + web_shim.js</text>
  <text x="35" y="763" class="sub">window.go · runtime over one WebSocket</text>
  <text x="35" y="781" class="sub">Output: binary frames · acknowledged</text>
  <text x="35" y="799" class="sub">Reconnects and gets only what it missed</text>
  <text x="35" y="817" class="sub">Files: this PC uses the window's dialogs,</text>
  <text x="35" y="835" class="sub">other PCs upload · download (.zip)</text>

  <path d="M292,773 L306,773 L306,557 L413,557" class="web" marker-start="url(#arrowWeb)" marker-end="url(#arrowWeb)"/>
  <text x="313" y="612" class="note" font-weight="bold" fill="#a50e0e">HTTPS</text>
  <text x="313" y="627" class="note" fill="#a50e0e">WebSocket</text>
  <text x="313" y="642" class="note" fill="#a50e0e">token login</text>

  <!-- Go backend -->
  <rect x="400" y="60" width="370" height="600" rx="8" fill="#e6f4ea" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="415" y="82" class="head" fill="#1e6b41">Go backend — choboterm.exe · internal/…</text>

  <rect x="415" y="95" width="340" height="75" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="114" class="title">app — App · tab (one per tab)</text>
  <text x="427" y="133" class="sub">pump: batches output per 16ms · 256KB, detects Zmodem</text>
  <text x="427" y="151" class="sub">emitFor: events only to the tab's owner (window · page)</text>

  <g class="item" stroke="#2f8f5b">
    <rect x="415" y="185" width="106" height="62" rx="5"/>
    <rect x="532" y="185" width="106" height="62" rx="5"/>
    <rect x="649" y="185" width="106" height="62" rx="5"/>
  </g>
  <text x="468" y="204" text-anchor="middle" class="title">sshconn</text>
  <text x="468" y="220" text-anchor="middle" class="sub">sshauth · sshjump</text>
  <text x="468" y="236" text-anchor="middle" class="sub">ssh config · PTY</text>
  <text x="585" y="204" text-anchor="middle" class="title">telnet · terminal</text>
  <text x="585" y="220" text-anchor="middle" class="sub">Session · detect</text>
  <text x="585" y="236" text-anchor="middle" class="sub">(protocol detect)</text>
  <text x="702" y="204" text-anchor="middle" class="title">localshell</text>
  <text x="702" y="220" text-anchor="middle" class="sub">Win: ConPTY</text>
  <text x="702" y="236" text-anchor="middle" class="sub">Linux: PTY</text>

  <g class="item" stroke="#2f8f5b">
    <rect x="415" y="262" width="164" height="62" rx="5"/>
    <rect x="588" y="262" width="79" height="62" rx="5"/>
    <rect x="676" y="262" width="79" height="62" rx="5"/>
  </g>
  <text x="427" y="281" class="title">transfer — RemoteFS</text>
  <text x="427" y="297" class="sub">sftp · scp · ftp · app/filexfer</text>
  <text x="427" y="313" class="sub">Progress · cancel · resume</text>
  <text x="627" y="281" text-anchor="middle" class="title">Zmodem</text>
  <text x="627" y="297" text-anchor="middle" class="sub">transfer · app</text>
  <text x="627" y="313" text-anchor="middle" class="sub">rz / sz</text>
  <text x="715" y="281" text-anchor="middle" class="title">serial</text>
  <text x="715" y="297" text-anchor="middle" class="sub">Win: COM</text>
  <text x="715" y="313" text-anchor="middle" class="sub">Linux: tty</text>

  <rect x="415" y="339" width="340" height="50" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="358" class="title">docker.go — list · start/stop · exec · logs</text>
  <text x="427" y="377" class="sub">Server: session on SSH · PC: ConPTY/PTY · podman</text>

  <rect x="415" y="399" width="340" height="76" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="418" class="title">store · config · secret · i18n — storage</text>
  <text x="427" y="437" class="sub">settings · sessions · hosts.json (DPAPI · keyring)</text>
  <text x="427" y="453" class="sub">i18n_en.json: English dictionary shared by UI and Go</text>
  <text x="427" y="469" class="sub">web-token · web-cert.pem (web server)</text>

  <rect x="415" y="485" width="340" height="114" rx="5" fill="#fff8f7" stroke="#c5221f" stroke-width="1.2"/>
  <text x="427" y="504" class="title">app/web*.go — web server</text>
  <text x="427" y="522" class="sub">--web · Settings · --headless (server, no window)</text>
  <text x="427" y="539" class="sub">An App per page (caller) · tab ids from clientID&lt;&lt;20</text>
  <text x="427" y="556" class="sub">ack · replay · dedup calls · flow control over 8MB</text>
  <text x="427" y="573" class="sub">Token cookie · Origin check · TLS for outside (self-signed)</text>
  <text x="427" y="590" class="sub">Close window → quit all / window only · rerun shows it</text>

  <rect x="415" y="606" width="340" height="47" rx="5" fill="#fff8f7" stroke="#c5221f" stroke-width="1.2"/>
  <text x="427" y="624" class="title">app/picker.go — file dialogs</text>
  <text x="427" y="642" class="sub">Window, local browser: Wails · remote: up/download</text>

  <!-- Lua host -->
  <line x1="585" y1="662" x2="585" y2="698" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="597" y="684" class="note">luarun · luaeval ⇄ luahost · JSON lines</text>
  <rect x="400" y="700" width="370" height="103" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="415" y="722" class="head" fill="#a35a10">Lua runner — choboterm.exe --lua-host</text>
  <text x="415" y="742" class="sub">Separate process · gopher-lua (Lua 5.1) · send · expect · screen</text>
  <text x="415" y="760" class="sub">luahost/luajob: memory limit (Job Object · Linux /proc)</text>
  <text x="415" y="778" class="sub">Tabs: console · scripts (luarun) <tspan class="new">NEW</tspan> the cat: once, no tab (luaeval)</text>
  <text x="415" y="795" class="sub">Several lines show the last one's value · 10 s · 64KB output</text>

  <!-- External -->
  <line x1="772" y1="230" x2="808" y2="230" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="790" y="222" text-anchor="middle" class="note">TCP</text>
  <line x1="772" y1="430" x2="808" y2="430" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="790" y="422" text-anchor="middle" class="note" font-size="9.5">PTY</text>
  <text x="790" y="446" text-anchor="middle" class="note" font-size="9.5">COM</text>

  <rect x="810" y="150" width="180" height="222" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="825" y="174" class="head" fill="#3c4043">Remote servers</text>
  <text x="825" y="198" class="sub">SSH (22) · Telnet (23)</text>
  <text x="825" y="218" class="sub">SFTP · SCP · FTP</text>
  <text x="825" y="238" class="sub">Port forwarding -L · -R · -D</text>
  <text x="825" y="258" class="sub">Zmodem (rz / sz)</text>
  <text x="825" y="278" class="sub">CP949 · UTF-8 servers</text>
  <text x="825" y="298" class="sub">Docker · podman</text>
  <rect x="822" y="312" width="156" height="46" rx="5" fill="#ffffff" stroke="#80868b" stroke-dasharray="4 3"/>
  <text x="900" y="331" text-anchor="middle" class="sub">Via jump host (bastion)</text>
  <text x="900" y="348" text-anchor="middle" class="sub">ProxyJump · ssh -J</text>

  <rect x="810" y="384" width="180" height="108" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="825" y="406" class="head" fill="#3c4043">This PC</text>
  <text x="825" y="426" class="sub">cmd · PowerShell · WSL</text>
  <text x="825" y="443" class="sub">bash · zsh (Linux)</text>
  <text x="825" y="460" class="sub">Docker Desktop · docker</text>
