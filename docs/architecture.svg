<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="800" viewBox="0 0 1010 800" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#202124">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowWeb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c5221f"/>
    </marker>
    <style>
      .title { font-size: 12px; font-weight: bold; }
      .head { font-size: 13px; font-weight: bold; }
      .sub { fill: #5f6368; }
      .note { font-size: 10.5px; fill: #3c4043; }
      .item { fill: #ffffff; stroke-width: 1; }
      .link { stroke: #5f6368; stroke-width: 1.5; fill: none; }
      .web { stroke: #c5221f; stroke-width: 1.5; fill: none; }
      .new { fill: #c5221f; font-size: 9.5px; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="1010" height="800" rx="10" fill="#ffffff"/>
  <text x="20" y="36" font-size="18" font-weight="bold">choboterm 아키텍처</text>
  <text x="990" y="36" text-anchor="end" class="note">V0.2.22 · <tspan class="new">NEW</tspan> = 이번 버전에 바뀜 (메모장)</text>

  <!-- Frontend -->
  <rect x="20" y="60" width="270" height="563" rx="8" fill="#e8f0fe" stroke="#4a7bd0" stroke-width="1.5"/>
  <text x="35" y="82" class="head" fill="#1a4fa3">프론트엔드 (WebView2 · WebKitGTK)</text>
  <g class="item" stroke="#4a7bd0">
    <rect x="35" y="95" width="240" height="48" rx="5"/>
    <rect x="35" y="153" width="240" height="48" rx="5"/>
    <rect x="35" y="211" width="240" height="48" rx="5"/>
    <rect x="35" y="269" width="240" height="48" rx="5"/>
    <rect x="35" y="327" width="240" height="48" rx="5"/>
    <rect x="35" y="385" width="240" height="48" rx="5"/>
    <rect x="35" y="443" width="240" height="48" rx="5"/>
    <rect x="35" y="501" width="240" height="48" rx="5"/>
    <rect x="35" y="559" width="240" height="48" rx="5"/>
  </g>
  <text x="47" y="115" class="title">main · tabs · connection</text>
  <text x="47" y="132" class="sub">탭 · 터미널 · main.ts를 모듈로 나눔</text>
  <text x="47" y="173" class="title">highlight.ts</text>
  <text x="47" y="190" class="sub">키워드 강조 (xterm 데코레이션)</text>
  <text x="47" y="231" class="title">files.ts</text>
  <text x="47" y="248" class="sub">파일 전송 창 (SFTP · SCP · FTP)</text>
  <text x="47" y="289" class="title">viewer.ts · imageview.ts</text>
  <text x="47" y="306" class="sub">텍스트 뷰어·편집기 (CodeMirror), 이미지</text>
  <text x="47" y="347" class="title">luaconsole.ts · memo.ts <tspan class="new">NEW</tspan></text>
  <text x="47" y="364" class="sub">Lua REPL · 메모 자동 저장 · Ctrl+Shift+B</text>
  <text x="47" y="405" class="title">containers.ts</text>
  <text x="47" y="422" class="sub">도커 컨테이너 창 (셸 · 로그 · 포트 열기)</text>
  <text x="47" y="463" class="title">prefs.ts</text>
  <text x="47" y="480" class="sub">설정 · 웹 서버 켜기/끄기 · 주소 · 새 토큰</text>
  <text x="47" y="521" class="title">i18n.ts</text>
  <text x="47" y="538" class="sub">영어 화면: 나타나는 문구를 사전으로 번역</text>
  <text x="47" y="579" class="title">sessions · help · search · platform</text>
  <text x="47" y="596" class="sub">세션, 도움말, 검색, Linux · 브라우저 판별</text>

  <!-- Wails bridge -->
  <line x1="292" y1="160" x2="398" y2="160" class="link" marker-end="url(#arrow)"/>
  <text x="345" y="96" text-anchor="middle" class="note" font-weight="bold">Go 메서드 호출</text>
  <text x="345" y="112" text-anchor="middle" class="note">Connect · Send</text>
  <text x="345" y="128" text-anchor="middle" class="note">Resize · ConsoleEval</text>
  <text x="345" y="144" text-anchor="middle" class="note">DockerList 등</text>
  <line x1="398" y1="300" x2="292" y2="300" class="link" marker-end="url(#arrow)"/>
  <text x="345" y="320" text-anchor="middle" class="note" font-weight="bold">이벤트</text>
  <text x="345" y="336" text-anchor="middle" class="note">term:data</text>
  <text x="345" y="352" text-anchor="middle" class="note">(base64 묶음)</text>
  <text x="345" y="368" text-anchor="middle" class="note">script:* · 진행률</text>
  <text x="345" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#5f6368">Wails v2</text>
  <text x="345" y="246" text-anchor="middle" class="note">바인딩</text>

  <!-- Browser (web server clients) -->
  <rect x="20" y="645" width="270" height="140" rx="8" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="35" y="667" class="head" fill="#a50e0e">브라우저 (이 PC · 다른 PC)</text>
  <text x="35" y="687" class="sub">같은 화면(frontend/dist) + web_shim.js</text>
  <text x="35" y="705" class="sub">window.go · runtime을 WebSocket 하나로</text>
  <text x="35" y="723" class="sub">출력: 바이너리 프레임 · 받으면 ack</text>
  <text x="35" y="741" class="sub">끊기면 다시 연결해 빠진 것만 받음</text>
  <text x="35" y="759" class="sub">파일: 이 PC는 창의 대화상자,</text>
  <text x="35" y="777" class="sub">다른 PC는 업로드 · 다운로드(.zip)</text>

  <path d="M292,715 L306,715 L306,557 L413,557" class="web" marker-start="url(#arrowWeb)" marker-end="url(#arrowWeb)"/>
  <text x="313" y="612" class="note" font-weight="bold" fill="#a50e0e">HTTPS</text>
  <text x="313" y="627" class="note" fill="#a50e0e">WebSocket</text>
  <text x="313" y="642" class="note" fill="#a50e0e">토큰 로그인</text>

  <!-- Go backend -->
  <rect x="400" y="60" width="370" height="600" rx="8" fill="#e6f4ea" stroke="#2f8f5b" stroke-width="1.5"/>
  <text x="415" y="82" class="head" fill="#1e6b41">Go 백엔드 — choboterm.exe · internal/…</text>

  <rect x="415" y="95" width="340" height="75" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="114" class="title">app — App · tab (탭마다 하나)</text>
  <text x="427" y="133" class="sub">pump: 출력을 16ms · 256KB씩 묶어 전송, Zmodem 감지</text>
  <text x="427" y="151" class="sub">emitFor: 이벤트를 탭 주인(창 · 각 페이지)에게만</text>

  <g class="item" stroke="#2f8f5b">
    <rect x="415" y="185" width="106" height="62" rx="5"/>
    <rect x="532" y="185" width="106" height="62" rx="5"/>
    <rect x="649" y="185" width="106" height="62" rx="5"/>
  </g>
  <text x="468" y="204" text-anchor="middle" class="title">sshconn</text>
  <text x="468" y="220" text-anchor="middle" class="sub">sshauth · sshjump</text>
  <text x="468" y="236" text-anchor="middle" class="sub">ssh config · PTY</text>
  <text x="585" y="204" text-anchor="middle" class="title">telnet · terminal</text>
  <text x="585" y="220" text-anchor="middle" class="sub">Session · detect</text>
  <text x="585" y="236" text-anchor="middle" class="sub">(프로토콜 판별)</text>
  <text x="702" y="204" text-anchor="middle" class="title">localshell</text>
  <text x="702" y="220" text-anchor="middle" class="sub">Win: ConPTY</text>
  <text x="702" y="236" text-anchor="middle" class="sub">Linux: PTY</text>

  <g class="item" stroke="#2f8f5b">
    <rect x="415" y="262" width="164" height="62" rx="5"/>
    <rect x="588" y="262" width="79" height="62" rx="5"/>
    <rect x="676" y="262" width="79" height="62" rx="5"/>
  </g>
  <text x="427" y="281" class="title">transfer — RemoteFS</text>
  <text x="427" y="297" class="sub">sftp · scp · ftp · app/filexfer</text>
  <text x="427" y="313" class="sub">진행률 · 취소 · 이어받기</text>
  <text x="627" y="281" text-anchor="middle" class="title">Zmodem</text>
  <text x="627" y="297" text-anchor="middle" class="sub">transfer · app</text>
  <text x="627" y="313" text-anchor="middle" class="sub">rz / sz</text>
  <text x="715" y="281" text-anchor="middle" class="title">serial</text>
  <text x="715" y="297" text-anchor="middle" class="sub">Win: COM</text>
  <text x="715" y="313" text-anchor="middle" class="sub">Linux: tty</text>

  <rect x="415" y="339" width="340" height="50" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="358" class="title">docker.go — 컨테이너 목록 · 시작/중지 · exec · logs</text>
  <text x="427" y="377" class="sub">서버: SSH 접속에 세션 추가 · PC: ConPTY/PTY · podman 대체</text>

  <rect x="415" y="399" width="340" height="76" rx="5" class="item" stroke="#2f8f5b"/>
  <text x="427" y="418" class="title">store · config · secret · i18n — 저장소</text>
  <text x="427" y="437" class="sub">settings · sessions · hosts.json (DPAPI · 키링)</text>
  <text x="427" y="453" class="sub">i18n_en.json: 화면과 Go가 함께 쓰는 영어 사전</text>
  <text x="427" y="469" class="sub">web-token · web-cert.pem (웹 서버)</text>

  <rect x="415" y="485" width="340" height="114" rx="5" fill="#fff8f7" stroke="#c5221f" stroke-width="1.2"/>
  <text x="427" y="504" class="title">app/web*.go — 웹 서버</text>
  <text x="427" y="522" class="sub">--web · 설정 창 · --headless (창 없이 서버만)</text>
  <text x="427" y="539" class="sub">페이지마다 App(호출자) · 탭 번호 clientID&lt;&lt;20부터</text>
  <text x="427" y="556" class="sub">ack · 재전송 · 중복 호출 제거 · 8MB 넘으면 흐름 제어</text>
  <text x="427" y="573" class="sub">토큰 쿠키 · Origin 검사 · 외부 주소는 TLS(자체 서명)</text>
  <text x="427" y="590" class="sub">창 닫기 → 모두 종료 / 창만 닫기 · 다시 실행하면 표시</text>

  <rect x="415" y="606" width="340" height="47" rx="5" fill="#fff8f7" stroke="#c5221f" stroke-width="1.2"/>
  <text x="427" y="624" class="title">app/picker.go — 파일 대화상자</text>
  <text x="427" y="642" class="sub">창 · 이 PC 브라우저: Wails 대화상자 / 다른 PC: 업로드 · 다운로드</text>

  <!-- Lua host -->
  <line x1="585" y1="662" x2="585" y2="698" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="597" y="684" class="note">app/luarun.go ⇄ luahost · JSON 한 줄씩</text>
  <rect x="400" y="700" width="370" height="85" rx="8" fill="#fff4e5" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="415" y="722" class="head" fill="#a35a10">Lua 실행기 — choboterm.exe --lua-host</text>
  <text x="415" y="742" class="sub">별도 프로세스 · gopher-lua (Lua 5.1) · send · expect · screen</text>
  <text x="415" y="760" class="sub">luahost/luajob: 메모리 제한 (Job Object · Linux /proc)</text>

  <!-- External -->
  <line x1="772" y1="230" x2="808" y2="230" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="790" y="222" text-anchor="middle" class="note">TCP</text>
  <line x1="772" y1="430" x2="808" y2="430" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="790" y="422" text-anchor="middle" class="note" font-size="9.5">PTY</text>
  <text x="790" y="446" text-anchor="middle" class="note" font-size="9.5">COM</text>

  <rect x="810" y="150" width="180" height="222" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="825" y="174" class="head" fill="#3c4043">원격 서버</text>
  <text x="825" y="198" class="sub">SSH (22) · Telnet (23)</text>
  <text x="825" y="218" class="sub">SFTP · SCP · FTP</text>
  <text x="825" y="238" class="sub">포트 포워딩 -L · -R · -D</text>
  <text x="825" y="258" class="sub">Zmodem (rz / sz)</text>
  <text x="825" y="278" class="sub">CP949 · UTF-8 서버</text>
  <text x="825" y="298" class="sub">Docker · podman</text>
  <rect x="822" y="312" width="156" height="46" rx="5" fill="#ffffff" stroke="#80868b" stroke-dasharray="4 3"/>
  <text x="900" y="331" text-anchor="middle" class="sub">점프 호스트(배스천) 경유</text>
  <text x="900" y="348" text-anchor="middle" class="sub">ProxyJump · ssh -J</text>

  <rect x="810" y="384" width="180" height="108" rx="8" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/>
  <text x="825" y="406" class="head" fill="#3c4043">이 PC</text>
  <text x="825" y="426" class="sub">cmd · PowerShell · WSL</text>
  <text x="825" y="443" class="sub">bash · zsh (Linux)</text>
  <text x="825" y="460" class="sub">Docker Desktop · docker</text>
  <text x="825" y="478" class="sub">시리얼 COM · /dev/ttyUSB</text>
  <!-- Releases -->
  <rect x="810" y="500" width="180" height="200" rx="8" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="825" y="523" class="head" fill="#6a1b9a">배포</text>
  <text x="825" y="543" class="sub">Windows: choboterm.exe</text>
  <text x="825" y="561" class="sub">Linux x86_64: tar.gz</text>
  <text x="825" y="579" class="sub">GitHub Actions에서 빌드</text>
  <text x="825" y="597" class="sub">GTK 3 · WebKitGTK 4.1</text>
  <text x="825" y="615" class="sub">curl로 받기 · install.sh</text>
  <text x="825" y="633" class="sub">새 버전 확인: releases API</text>
  <text x="825" y="655" class="title" fill="#6a1b9a">창 없는 웹 서버</text>
  <text x="825" y="673" class="sub">choboterm-headless(.exe)</text>
  <text x="825" y="691" class="sub">GTK 없이 도는 정적 바이너리</text>
</svg>
